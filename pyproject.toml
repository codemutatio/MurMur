[project]
name = "murmur"
version = "0.1.0"
description = "Personal always-on voice transcription for macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4.1",
    "silero-vad>=5.1",
    "torch>=2.0",
    "sounddevice>=0.5.1",
    "numpy>=1.24",
    "rumps>=0.4.0",
    "pynput>=1.7",
    "openai>=1.0",
    "huggingface-hub>=0.23",
    "pyobjc-framework-AVFoundation>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]

[project.scripts]
murmur = "murmur.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murmur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-m", "not hardware",
    "--cov=src/murmur",
    "--cov-report=term-missing",
]
markers = [
    "hardware: requires microphone, mlx model weights, menubar GUI, or human judgment (deselect with -m 'not hardware')",
]

[tool.coverage.run]
source = ["src/murmur"]
# window.py is PyObjC/AppKit view glue that needs a running window server to
# exercise; its logic lives in tested modules (output.reader, app.settings_io).
omit = ["scripts/*", "*/app/window.py"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "N", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# window.py uses PyObjC selector method names (initWithDeps_, onTick_, …) which
# must be camelCase to bridge to Objective-C; N802 (snake_case) does not apply.
"src/murmur/app/window.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "rumps",
    "rumps.*",
    "pynput",
    "pynput.*",
    "mlx_whisper",
    "mlx_whisper.*",
    "silero_vad",
    "silero_vad.*",
    "sounddevice",
    "sounddevice.*",
    "AVFoundation",
    "AVFoundation.*",
    "ApplicationServices",
    "ApplicationServices.*",
    "AppKit",
    "AppKit.*",
    "Cocoa",
    "Cocoa.*",
    "Foundation",
    "Foundation.*",
    "objc",
    "objc.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# window.py is dynamic PyObjC glue: helper methods use the untyped
# @objc.python_method decorator, which strict mode would otherwise reject.
module = ["murmur.app.window"]
disallow_untyped_decorators = false

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]
